name: dockseed-gitlab-runner

services:
  dockseed-gitlab-runner:
    image: gitlab/gitlab-runner:alpine-v${GITLAB_RUNNER_VERSION:?请在 version.env 中配置 GITLAB_RUNNER_VERSION}
    container_name: dockseed-gitlab-runner
    restart: unless-stopped
    privileged: false
    volumes:
      - ./runner/config:/etc/gitlab-runner
      # 仅 Runner manager 使用宿主 Docker；Job 容器不会继承这个挂载。
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal=host-gateway"
    stop_signal: SIGQUIT
    stop_grace_period: 1h
